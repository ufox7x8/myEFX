<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>myEFX — Frequalizer-style UI</title>
<style>
:root{--bg:#252b2f;--panel:#2f3a40;--panel2:#344249;--edge:#172127;--grid:#9da9ae33;--text:#e8ecee;--muted:#aeb8bc;--blue:#3a8fff;--green:#75ff19;--red:#ff685f;--orange:#ff9828;--lime:#a6ea27;--gold:#ffbf2a;--cyan:#43c8ff;--shadow:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202629;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,input,select{font:inherit}.app{width:min(1600px,100vw);min-height:100vh;margin:auto;background:#2c383e;border:1px solid #161d20;box-shadow:0 0 0 1px #4a555a inset,0 18px 60px rgba(0,0,0,.45)}
.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:7px 12px;background:linear-gradient(#252a2d,#202427);border-bottom:1px solid #131a1d}.power{width:48px;height:48px;border-radius:50%;border:3px solid #3492ff;background:transparent;color:#70b4ff;font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:0 0 12px #167eff2e inset;cursor:pointer}.preset{height:34px;min-width:285px;padding:0 34px 0 12px;border:1px solid #454a4d;border-radius:4px;background:#343637;color:#8f9699;font-size:16px;appearance:auto}.tools{display:flex;align-items:center;gap:6px}.tool{height:31px;min-width:45px;border:1px solid #454a4e;border-radius:4px;background:#353b3e;color:#c6cbcd;font-weight:700;cursor:pointer}.tool.small{min-width:31px;font-size:17px}.tool.active{background:#3473a8;border-color:#6aa5d9;color:#fff}.grow{flex:1}.view{height:34px;padding:0 10px;border:0;background:transparent;color:#b2b8ba}.view select{margin-left:5px;height:28px;background:#3b4144;color:#e1e4e4;border:1px solid #555c60;border-radius:3px}.link{width:33px;height:33px;border:1px solid #4e575b;background:#30373a;border-radius:4px;color:#d0d6d8;font-size:18px}
.graph-wrap{position:relative;margin:3px 4px 0;background:#34444b;border:1px solid #93a0a633;border-radius:7px 7px 0 0;overflow:hidden;box-shadow:inset 0 1px #ffffff08}.graph{display:block;width:100%;height:390px;background:#34444b}.drop-ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.drop-card{pointer-events:auto;padding:10px 18px;border:1px solid #89979b55;border-radius:4px;background:#20272acc;color:#ced4d7;box-shadow:var(--shadow);text-align:center;display:none}.graph-wrap.empty .drop-card{display:block}.drop-card b{display:block;font-size:13px}.drop-card span{display:block;margin-top:3px;color:#8f9ca1;font-size:10px}.graph-legend{position:absolute;right:10px;top:10px;font-size:14px;line-height:1.55;text-align:right;pointer-events:none;text-shadow:0 1px 1px #000}.in-label{color:var(--lime)}.out-label{color:var(--red)}.freq-readout{position:absolute;left:10px;bottom:8px;color:#aeb8bc;font-size:11px;pointer-events:none}.graph-pointer{position:absolute;width:1px;top:0;bottom:0;background:#eaf1f33d;pointer-events:none;display:none}.node-layer{position:absolute;inset:0}.node{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #172027;box-shadow:0 0 0 1px #fff6,0 1px 6px #0009;transform:translate(-50%,-50%);cursor:grab}.node:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:999px;background:currentColor;opacity:.32;pointer-events:none}.node.dragging{cursor:grabbing;box-shadow:0 0 0 1px #fff,0 0 12px currentColor}.node.n1{background:var(--blue);color:var(--blue)}.node.n2{background:var(--red);color:var(--red)}.node.n3{background:var(--lime);color:var(--lime)}.node.n4{background:var(--orange);color:var(--orange)}
.hidden-canvas{display:none}.axis{position:absolute;left:0;right:0;bottom:0;height:29px;padding:6px 8px 0;color:#b6c0c4;font-size:11px;display:flex;justify-content:space-between;pointer-events:none}.ylabels{position:absolute;left:7px;top:7px;bottom:26px;display:flex;flex-direction:column;justify-content:space-between;color:#c5cdd0;font-size:11px;pointer-events:none}
.bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 150px;gap:4px;padding:0 4px 4px}.band{min-width:0;position:relative;background:#35444a;border:1px solid var(--bc);border-radius:0 0 3px 3px;box-shadow:inset 0 1px #ffffff12}.band.b1{--bc:#2d5fff}.band.b2{--bc:#ef3a3a}.band.b3{--bc:#37c832}.band.b4{--bc:#ff7118}.band-head{height:34px;display:flex;align-items:center;gap:5px;padding:3px 6px;border-bottom:1px solid #81909655;color:#dfe3e5}.band-title{font-weight:700;font-size:13px;min-width:70px}.filter{flex:1;min-width:0;height:28px;border:1px solid #7e898d;background:#3f4b50;color:#f0f2f2;border-radius:3px;padding:0 7px}.micro{width:28px;height:24px;border:1px solid #7e898d;background:#3f4b50;color:#e5e9ea;border-radius:4px;font-weight:800;cursor:pointer}.micro.on{background:#1e7f2b;border-color:#65be70}.band-body{padding:5px 7px 7px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.ctrl{min-width:0;text-align:center}.ctrl label{font-size:9px;color:#bcc5c8;display:block;margin-bottom:2px}.knob{width:72px;height:72px;margin:auto;border-radius:50%;border:1px solid #152027;background:radial-gradient(circle at 35% 30%,#536066,#2e3c42 42%,#19262b 77%);position:relative;cursor:ns-resize;touch-action:none;box-shadow:inset 0 0 10px rgba(0,0,0,.55)}.knob:before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #a5afb3;opacity:.26;border-right-color:transparent;transform:rotate(-35deg)}.knob-pointer{position:absolute;left:50%;top:7px;width:3px;height:18px;border-radius:3px;background:#54a9dc;transform-origin:50% 29px}.knob-readout{margin:2px auto 0;min-height:18px;width:74px;padding:2px 3px;border:1px solid #7e898d;background:#344146;color:#f4f6f6;font-size:9px}.band-foot{display:flex;align-items:center;justify-content:space-between;padding:0 7px 7px}.foot-left{display:flex;gap:4px}.round{width:25px;height:23px;border-radius:3px;border:1px solid #7f898e;background:#354247;color:#d8dde0;font-weight:800;cursor:pointer}.round.active{background:#39a139;border-color:#79d87b}.round.off{background:#69333a;border-color:#e2747b}.utility{font-size:9px;color:#afb8bb}.band-buttons{display:none}
.output{background:#35444a;border:1px solid #88969a;border-radius:0 0 4px 4px;position:relative;min-height:302px;padding:9px 8px}.output-title{font-size:14px;color:#dfe4e6;text-align:center;margin-bottom:4px}.out-knob{width:112px;height:112px;margin:13px auto 7px}.out-readout{width:85px;margin:auto;text-align:center}.social-row{display:flex;gap:4px;position:absolute;left:7px;right:7px;bottom:6px}.social{width:27px;height:27px;border:1px solid #667278;background:#293337;color:#f0f3f4;border-radius:3px;font-weight:800}
.branding{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid #69757a33;background:#2d383d}.brand{font-size:22px;letter-spacing:.12em;font-weight:800;color:#35d6ff;text-shadow:0 0 10px #00aaff22}.brand span{color:#4b7f95}.statusbar{font-size:10px;color:#a8b2b5}.transport{display:flex;align-items:center;gap:7px;padding:5px 7px;background:#2a3439;border-top:1px solid #121a1d}.transport button{height:30px;border:1px solid #59666b;background:#354247;color:#e2e7e8;border-radius:4px;padding:0 10px}.transport .primary{background:#2e78b0;border-color:#79b4df}.transport .spacer{flex:1}
@media(max-width:1100px){.bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.output{grid-column:1/-1;min-height:180px}.topbar{flex-wrap:wrap;height:auto}.preset{min-width:180px}.graph{height:340px}}@media(max-width:720px){.bottom{grid-template-columns:1fr}.output{grid-column:auto}.graph{height:285px}.topbar{gap:6px}.preset{min-width:140px}.band-body{grid-template-columns:repeat(3,1fr)}.knob{width:58px;height:58px}.out-knob{width:90px;height:90px}.brand{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="power" id="bypassAll" type="button" title="BYPASS ALL">⏻</button>
    <select class="preset" id="preset"><option>Manual</option></select>
    <div class="tools">
      <button class="tool small" id="undo" type="button">‹</button><button class="tool small" id="redo" type="button">›</button>
      <button class="tool active" id="ab" type="button">Compare</button>
      <button class="tool" id="copy" type="button">Copy</button><button class="tool" id="paste" type="button">Paste</button>
      <button class="tool" id="undo2" type="button">Undo</button><button class="tool" id="redo2" type="button">Redo</button>
    </div>
    <div class="grow"></div>
    <div class="view">View:<select id="viewMode"><option>Editor</option></select></div>
    <button class="link" id="linkBtn" type="button">↗</button>
  </header>
  <section class="graph-wrap empty" id="graphWrap" aria-label="EQ graph">
    <canvas id="specIn" class="hidden-canvas"></canvas><canvas id="specOut" class="hidden-canvas"></canvas>
    <canvas id="uiGraph" class="graph"></canvas>
    <div class="node-layer" id="nodeLayer"></div>
    <div class="graph-legend"><div class="in-label">Input</div><div class="out-label">Output</div></div>
    <div class="freq-readout" id="freqReadout">20 Hz</div><div class="graph-pointer" id="graphPointer"></div>
    <div class="ylabels"><span>+12 dB</span><span>+6 dB</span><span>0 dB</span><span>-6 dB</span><span>-12 dB</span></div>
    <div class="axis"><span>20 Hz</span><span>40</span><span>80</span><span>160</span><span>320 Hz</span><span>640</span><span>1.3 kHz</span><span>2.6 kHz</span><span>5.1 kHz</span><span>10 kHz</span><span>20 kHz</span></div>
    <div class="drop-ui" id="dropUi"><label class="drop-card" for="file"><b>Drop WAV / AIFF / FLAC / MP3</b><span>or click to choose an audio file</span></label><input id="file" type="file" accept="audio/*,.wav,.wave,.aif,.aiff,.flac,.mp3,.m4a,.ogg" hidden></div>
    <div class="drop-target" id="inputFrame" style="position:absolute;inset:0;pointer-events:none"></div>
    <div id="outputFrame" style="display:none"></div><div id="rangeIn" style="display:none"></div><div id="rangeOut" style="display:none"></div><div id="cursorIn" style="display:none"></div><div id="cursorOut" style="display:none"></div>
  </section>
  <section class="bottom">
    <article class="band b1" data-band="1"><div class="band-head"><span class="band-title">Lowest</span><select class="filter" data-filter="1"><option>Peak</option></select><button class="micro" id="solo1" data-action="solo" type="button">S</button><button class="micro on band-byp" id="byp1" data-action="bypass" type="button">A</button></div><div class="band-body"></div><div class="band-foot"><div class="foot-left"><button class="round" data-action="delta" type="button">Δ</button><button class="round" data-action="reset" type="button">↺</button></div><span class="utility state">ON</span></div></article>
    <article class="band b2" data-band="2"><div class="band-head"><span class="band-title">Low Mids</span><select class="filter" data-filter="2"><option>Peak</option></select><button class="micro" id="solo2" data-action="solo" type="button">S</button><button class="micro on band-byp" id="byp2" data-action="bypass" type="button">A</button></div><div class="band-body"></div><div class="band-foot"><div class="foot-left"><button class="round" data-action="delta" type="button">Δ</button><button class="round" data-action="reset" type="button">↺</button></div><span class="utility state">ON</span></div></article>
    <article class="band b3" data-band="3"><div class="band-head"><span class="band-title">High Mids</span><select class="filter" data-filter="3"><option>Peak</option></select><button class="micro" id="solo3" data-action="solo" type="button">S</button><button class="micro on band-byp" id="byp3" data-action="bypass" type="button">A</button></div><div class="band-body"></div><div class="band-foot"><div class="foot-left"><button class="round" data-action="delta" type="button">Δ</button><button class="round" data-action="reset" type="button">↺</button></div><span class="utility state">ON</span></div></article>
    <article class="band b4" data-band="4"><div class="band-head"><span class="band-title">High</span><select class="filter" data-filter="4"><option>Peak</option></select><button class="micro" id="solo4" data-action="solo" type="button">S</button><button class="micro on band-byp" id="byp4" data-action="bypass" type="button">A</button></div><div class="band-body"></div><div class="band-foot"><div class="foot-left"><button class="round" data-action="delta" type="button">Δ</button><button class="round" data-action="reset" type="button">↺</button></div><span class="utility state">ON</span></div></article>
    <aside class="output"><div class="output-title">Output</div><div class="knob out-knob"><div class="knob-pointer"></div></div><div class="knob-readout out-readout">0.0 dB</div><div class="social-row"><button class="social" type="button">f</button><button class="social" type="button">in</button><button class="social" type="button">◎</button></div></aside>
  </section>
  <div class="branding"><div class="brand">my<span>EFX</span></div><div class="statusbar" id="status">尚未載入音檔。</div></div>
  <div class="transport"><button class="primary" id="play" type="button">▶</button><button id="stop" type="button">■</button><button id="loop" type="button">Loop</button><button id="resetAll" type="button">Reset</button><button id="sortBtn" type="button">Sort</button><button class="spacer" style="visibility:hidden" type="button"></button><span id="time">0.00 / 0.00 s</span><span id="fileInfo">未載入</span></div>
</div>
<script>
const FREQ_RANGES=[[20,300,.1],[60,1200,.1],[200,3000,.1],[1000,25000,.1]];const FREQS=[31.5,125,1000,8000];const COMMON={gain:[-24,24,.1],q:[.1,20,.01],denoise:[0,100,1],punch:[-100,100,1],sustain:[-100,100,1]};const KNOBS=[['FREQ','freq'],['GAIN','gain'],['Q','q'],['DE-NOISE','denoise'],['PUNCH','punch'],['SUSTAIN','sustain']];
for(const [i,card] of [...document.querySelectorAll('.band')].entries()){const grid=card.querySelector('.band-body'),fr=FREQ_RANGES[i];for(const [label,key] of KNOBS){let min,max,step,v=0;if(key==='freq'){[min,max,step]=fr;v=FREQS[i]}else{[min,max,step]=COMMON[key];v=key==='q'?1:0}const id=key+(i+1),c=document.createElement('div');c.className='ctrl';c.innerHTML=`<label>${label}</label><div class="knob" data-target="${id}" tabindex="0" role="slider" aria-label="${label}"><div class="knob-pointer"></div></div><div class="knob-readout" id="${id}Out"></div><input class="knob-input" id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" defaultValue="${v}" hidden>`;grid.appendChild(c)}}
</script>
<script src="app-final.js?v=frequalizer-ui"></script><script src="ui-frequalizer.js?v=1"></script>
</body></html>
