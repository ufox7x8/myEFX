<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>myEFX — Spectral Dynamic Processor</title>
<style>
:root{
  --bg:#071016;--panel:#0b1820;--panel2:#0d2028;--grid:#17313a;--text:#eaf3f5;--muted:#7e969f;--accent:#6de7e1;--line:#21414b;
  --b1:#ff553f;--b2:#a4e52d;--b3:#ffd52b;--b4:#34e5e0;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(1100px 520px at 50% -100px,#12303b 0%,#071016 60%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;font-size:13px}body{padding:18px}button,input{font:inherit}button{color:inherit}
.app{width:min(1540px,100%);margin:auto}.topbar{height:52px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#12262d,#0b181f);display:flex;align-items:center;padding:0 14px;gap:12px}.logo{font-weight:900;font-size:18px;font-style:italic;letter-spacing:-.05em}.brand{display:flex;align-items:center;gap:11px}.brand small{color:#86a0a8;font-size:10px;border-left:1px solid var(--line);padding-left:10px}.top-actions{display:flex;gap:6px;margin-left:auto}.mini{height:30px;padding:0 10px;background:#0a151b;border:1px solid #2a4b55;border-radius:6px;color:#a7bdc4;font-size:11px}.mini.active,.mini:hover{border-color:#5bc5c4;color:#eaffff}
.panel{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(10,24,31,.97),rgba(6,16,21,.98));overflow:hidden}.panel-head{height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px}.panel-title{font-size:10px;font-weight:900;letter-spacing:.11em;color:#91a9b0}.panel-meta{margin-left:auto;font-size:10px;color:#607b84}
.spec-wrap{padding:10px}.spec-frame{position:relative;border:1px solid #284952;border-radius:7px;overflow:hidden;background:#02080c}.spec{display:block;width:100%;height:270px}.spec-cursor{position:absolute;top:0;bottom:0;width:1px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);pointer-events:none}.spec-time{display:flex;justify-content:space-between;color:#668088;font-size:10px;margin-top:5px}.spec-label{margin:8px 0 5px;color:#7e999f;font-size:10px;letter-spacing:.09em;font-weight:800}.processed-frame{height:220px}.processed-frame .spec{height:218px}
.transport{display:flex;align-items:center;gap:6px;margin-top:10px}.transport button{height:34px;padding:0 13px;border:1px solid #2a4a54;background:#0d1b22;border-radius:6px;font-size:11px}.transport button:hover{border-color:#62c9ca}.transport .primary{background:#12373d;border-color:#4dbbb8;color:#e4ffff}.transport .active{background:#3a2911;border-color:#d9a73e;color:#ffe2a4}.status{margin-left:auto;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#729099;font-size:10px}
.eq-panel{padding:10px}.band-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.band{border:1px solid #22414a;border-radius:8px;background:linear-gradient(180deg,#0e2027,#0a171d);overflow:hidden}.band-head{height:34px;border-bottom:1px solid #1e3942;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.band-name{font-weight:900;font-size:10px;letter-spacing:.08em}.band-ind{width:7px;height:7px;border-radius:50%}.b1 .band-ind{background:var(--b1);box-shadow:0 0 8px rgba(255,85,63,.8)}.b2 .band-ind{background:var(--b2);box-shadow:0 0 8px rgba(164,229,45,.8)}.b3 .band-ind{background:var(--b3);box-shadow:0 0 8px rgba(255,213,43,.8)}.b4 .band-ind{background:var(--b4);box-shadow:0 0 8px rgba(52,229,224,.8)}
.band-body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 4px;padding:10px 6px 8px}.param{text-align:center;min-width:0}.label{color:#778f97;font-size:9px;letter-spacing:.06em;font-weight:800;margin-bottom:4px;text-transform:uppercase}.knob{width:66px;height:66px;margin:auto;position:relative;border-radius:50%;border:1px solid #2b515b;background:radial-gradient(circle at 33% 27%,#39545b 0,#1c3036 35%,#091218 72%);box-shadow:inset 0 2px 7px rgba(255,255,255,.08),inset 0 -7px 10px rgba(0,0,0,.55),0 5px 14px rgba(0,0,0,.32);cursor:ns-resize;touch-action:none}.knob:hover{border-color:#79c8ca}.band.b1 .knob{--kc:var(--b1)}.band.b2 .knob{--kc:var(--b2)}.band.b3 .knob{--kc:var(--b3)}.band.b4 .knob{--kc:var(--b4)}.knob::before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid color-mix(in srgb,var(--kc) 82%,transparent);border-left-color:transparent;transform:rotate(-45deg);opacity:.95}.knob-pointer{position:absolute;left:50%;top:7px;width:2px;height:18px;border-radius:2px;background:#eefefe;transform-origin:50% 26px;box-shadow:0 0 6px rgba(255,255,255,.7);pointer-events:none}.value{margin-top:4px;color:#d9e9ed;font-size:10px;line-height:1.05;white-space:nowrap}.hint{font-size:8px;color:#526c74;min-height:10px}.band-foot{display:flex;gap:5px;border-top:1px solid #1d3841;padding:7px}.band-foot button{flex:1;height:25px;border:1px solid #294852;background:#0b171c;border-radius:5px;font-size:9px;color:#78919a}.band-foot button.active{border-color:#d4b15a;color:#ffe5a1;background:#342913}
.note{padding:6px 10px;color:#536d75;font-size:9px;border-top:1px solid #17323a}.kbd{color:#91a8af}.hidden{display:none}
@media(max-width:1100px){.band-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spec{height:230px}.processed-frame{height:190px}.processed-frame .spec{height:188px}}
@media(max-width:680px){body{padding:8px}.topbar{height:48px}.brand small{display:none}.top-actions .mini:nth-child(n+3){display:none}.band-grid{grid-template-columns:1fr}.band-body{grid-template-columns:repeat(3,minmax(0,1fr))}.spec{height:190px}.processed-frame{height:150px}.processed-frame .spec{height:148px}.transport{flex-wrap:wrap}.status{width:100%;max-width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">myEFX</div><small>4-BAND SPECTRAL DYNAMIC PROCESSOR</small></div><div class="top-actions"><button class="mini" id="resetAll">RESET</button><button class="mini" id="about">WEB TESTER</button></div></header>
<section class="panel">
  <div class="panel-head"><div class="panel-title">SPECTROGRAM / INPUT</div><div class="panel-meta">20 Hz — 20 kHz · full program</div></div>
  <div class="spec-wrap"><div class="spec-frame" id="inputFrame"><canvas class="spec" id="specIn"></canvas><div class="spec-cursor" id="cursorIn"></div><div id="dropPrompt" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,8,12,.40);pointer-events:none"><div style="padding:12px 18px;border:1px solid #2d515b;border-radius:7px;background:rgba(4,13,18,.85);text-align:center"><b>拖曳音檔到這裡</b><div style="margin-top:4px;color:#759099;font-size:11px">或點一下選擇 WAV / AIFF</div></div></div><input id="file" type="file" accept="audio/*,.wav,.wave,.aif,.aiff,.flac,.mp3,.m4a,.ogg" hidden></div><div class="spec-time"><span id="time">0.00 / 0.00 s</span><span id="fileInfo">未載入</span></div>
  <div class="spec-label">SPECTROGRAM / PROCESSED — 參數改變後重建整篇</div><div class="spec-frame processed-frame"><canvas class="spec" id="specOut"></canvas><div class="spec-cursor" id="cursorOut"></div></div>
  <div class="transport"><button class="primary" id="play">▶ 播放</button><button id="stop">■ 停止</button><button id="loop">LOOP OFF</button><button id="bypass">BYPASS OFF</button><button id="ab">A/B · A</button><div class="status" id="status">尚未載入音檔。</div></div></div>
</section>
<section class="panel"><div class="panel-head"><div class="panel-title">4-BAND PROCESSING</div><div class="panel-meta">EQ · DE-NOISE · PUNCH / SUSTAIN · DELTA</div></div><div class="eq-panel"><div class="band-grid" id="bands"></div></div><div class="note">旋鈕：上下拖曳、滾輪、雙擊 reset、鍵盤操作。<span class="kbd">DELTA</span> = 只聽該 Band 被處理後新增／減少的頻率內容。</div></section>
</div>
<script>
const bands=document.getElementById('bands'),defs=[100,500,2000,8000];
const params=[['Freq','freq','20','20000','1','Hz'],['Gain','gain','-24','24','0.1','dB'],['Q','q','0.1','20','0.01',''],['De-noise','denoise','0','100','1','%'],['PUNCH','punch','-100','100','1','%'],['Sustain','sustain','-100','100','1','%']];
for(let b=1;b<=4;b++){const card=document.createElement('article');card.className=`band b${b}`;card.innerHTML=`<div class="band-head"><span class="band-name">BAND ${b}</span><span class="band-ind"></span></div><div class="band-body"></div><div class="band-foot"><button data-action="delta" data-band="${b}">DELTA</button><button data-action="reset" data-band="${b}">RESET BAND</button></div>`;const body=card.querySelector('.band-body');for(const [title,key,min,max,step,unit] of params){const id=key+b,value=key==='freq'?defs[b-1]:(key==='q'?1:0);const p=document.createElement('div');p.className='param';p.innerHTML=`<div class="label">${title}</div><div class="knob" data-target="${id}" tabindex="0"><div class="knob-pointer"></div><div class="value" id="${id}Out">${value}${unit}</div><div class="hint">${key==='denoise'?'7 o’clock = 0':(key==='gain'||key==='punch'||key==='sustain'?'12 o’clock = 0':'')}</div></div><input id="${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}" hidden>`;body.appendChild(p)}bands.appendChild(card)}
</script><script src="app.js?v=62"></script></body></html>
