name: myEFX DELTA 600x Linearity Test

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/delta-linearity-600.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta-linearity-600:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build canonical app and finalize De-noise
        run: |
          node WebTester/build-v5-fix.js
          node WebTester/denoise-reference-fix.js
          node WebTester/denoise-canonicalize.js
      - name: Syntax check
        run: |
          node --check WebTester/build-v5-fix.js
          node --check WebTester/denoise-reference-fix.js
          node --check WebTester/denoise-canonicalize.js
          node --check WebTester/denoise-verify-600.js
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Run exact 600-point De-noise tests
        run: node WebTester/denoise-verify-600.js
