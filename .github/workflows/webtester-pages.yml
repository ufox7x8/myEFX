name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
          node --check WebTester/knob-ui.js
          node --check WebTester/io-fix.js
      - name: Validate generated 4-band knob UI
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('WebTester/index.html').read_text(encoding='utf-8')
          required=[
              '4-BAND SPECTRAL DYNAMIC PROCESSOR',
              'defaults=[31.5,125,1000,8000]',
              'const knobDefs',
              'data-action="bypass"',
              'data-action="delta"',
              'class="knob"',
              'knob-ui.js',
              'io-fix.js'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing UI markers: '+', '.join(missing))
          if 'perf-fix.js' in s:
              raise SystemExit('Legacy perf-fix.js must not be loaded by index.html')
          print('4-band generated knob UI validation OK')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: mkdir -p _site && cp -R WebTester/. _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
