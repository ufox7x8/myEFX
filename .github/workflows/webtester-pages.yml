name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js

      - name: Validate clean rewrite
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app.js
          test -s WebTester/denoise-processor.js
          test -s WebTester/transient-processor.js
          grep -q 'id="byp1"' WebTester/index-fixed.html
          grep -q 'id="byp4"' WebTester/index-fixed.html
          grep -q 'app.js?v=5' WebTester/index-fixed.html
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('WebTester/app.js','utf8');
          const dn = fs.readFileSync('WebTester/denoise-processor.js','utf8');
          const tr = fs.readFileSync('WebTester/transient-processor.js','utf8');
          const required = [
            'BAND_COUNT = 4',
            'deltaBand',
            'Wet−Dry',
            "denoise-processor.js?v=rewrite2",
            "transient-processor.js?v=rewrite2",
            'myefx-denoise',
            'myefx-transient',
            'WetBand'
          ];
          for (const s of required) if (!app.includes(s)) throw new Error('Missing app contract: ' + s);
          if (!dn.includes('Math.pow(10, -reductionDb / 20)')) throw new Error('Denoise gain contract missing');
          if (!dn.includes('this.gain = 1')) throw new Error('Denoise unity contract missing');
          if (!tr.includes("Math.abs(punch) < 0.0001")) throw new Error('Transient bypass contract missing');
          console.log('Clean rewrite validation passed');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
