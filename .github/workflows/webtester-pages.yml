name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build canonical WebTester app
        run: |
          node WebTester/build-v5-fix.js
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/build-v5-fix.js
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Validate DELTA architecture and math contracts
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app.js
          test -s WebTester/denoise-processor.js
          test -s WebTester/transient-processor.js
          grep -q 'id="byp1"' WebTester/index-fixed.html
          grep -q 'id="byp2"' WebTester/index-fixed.html
          grep -q 'id="byp3"' WebTester/index-fixed.html
          grep -q 'id="byp4"' WebTester/index-fixed.html
          grep -q 'app.js?v=5' WebTester/index-fixed.html
          grep -q 'rangeIn' WebTester/index-fixed.html
          grep -q 'rangeOut' WebTester/index-fixed.html
          grep -q 'deltaBandHP1' WebTester/app.js
          grep -q 'deltaBandHP2' WebTester/app.js
          grep -q 'deltaBandLP1' WebTester/app.js
          grep -q 'deltaBandLP2' WebTester/app.js
          grep -q 'deltaEQ' WebTester/app.js
          grep -q 'deltaDenoise' WebTester/app.js
          grep -q 'deltaTransient' WebTester/app.js
          grep -q 'deltaDryDelay' WebTester/app.js
          grep -q 'DELTA_DENOISE_LATENCY_SAMPLES' WebTester/app.js
          grep -q 'deltaDryInvert' WebTester/app.js
          grep -q 'deltaMute' WebTester/app.js
          grep -q 'source.connect(selected.deltaBandHP1)' WebTester/app.js
          grep -q 'selected.deltaMute.connect(graph.master)' WebTester/app.js
          grep -q 'denoise-processor.js?v=delta9' WebTester/app.js
          grep -q 'transient-processor.js?v=delta9' WebTester/app.js
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('WebTester/app.js','utf8');
          const fnA = s.indexOf('function connectPlayback()');
          const fnB = s.indexOf('function restartAtCurrentPosition()', fnA);
          if (fnA < 0 || fnB < 0 || fnB <= fnA) throw new Error('connectPlayback function not found');
          const fn = s.slice(fnA, fnB);
          const dA = fn.indexOf('if (deltaBand) {');
          const dB = fn.indexOf('// Normal serial processing path.', dA);
          if (dA < 0 || dB < 0 || dB <= dA) throw new Error('DELTA branch boundary not found');
          const d = fn.slice(dA, dB);
          const required = [
            'for (const stage of graph.stages)',
            'stage.deltaMute.disconnect(graph.master)',
            'const selected = graph.stages[deltaBand - 1]',
            'source.connect(selected.deltaBandHP1)',
            'selected.deltaMute.connect(graph.master)',
            'return;'
          ];
          for (const marker of required) if (!d.includes(marker)) throw new Error(`DELTA routing marker missing: ${marker}`);
          const forbidden = ['node = s.out', 'node.connect(s.eq)', 'node.connect(s.split)', 'deltaBand - 1; i++'];
          for (const marker of forbidden) if (d.includes(marker)) throw new Error(`Forbidden cross-Section routing in DELTA branch: ${marker}`);
          if (d.includes('graph.stages[i].out')) throw new Error('DELTA references another Section output');
          if (!s.includes('deltaDryDelay.delayTime.setTargetAtTime(DELTA_DENOISE_LATENCY_SAMPLES / ctx.sampleRate')) throw new Error('Dry latency alignment missing');

          // Pure mathematical sanity check: 3 non-selected Sections are exactly zero.
          const dry = [
            new Float64Array([1,2,3,4]),
            new Float64Array([2,2,2,2]),
            new Float64Array([3,4,5,6]),
            new Float64Array([4,4,4,4])
          ];
          const selected = 1;
          const delta = dry.map((x,i) => i === selected ? x.map(v => v * 0.98 - v) : x.map(() => 0));
          for (let i = 0; i < 4; i++) {
            for (const v of delta[i]) {
              if (i !== selected && v !== 0) throw new Error('Non-selected Section leaked into DELTA');
            }
          }
          const peak = Math.max(...delta[selected].map(v => Math.abs(v)));
          if (!(peak > 0 && peak < 0.1)) throw new Error(`Unexpected small-difference peak: ${peak}`);
          console.log('PASS: DELTA one-Section routing, four-band isolation, dry latency alignment, and Wet-minus-Dry math contracts.');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
