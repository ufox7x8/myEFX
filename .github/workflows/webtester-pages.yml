name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Validate clean 4-band DSP contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('WebTester/index-fixed.html').read_text(encoding='utf-8')
          app=Path('WebTester/app.js').read_text(encoding='utf-8')
          dn=Path('WebTester/denoise-processor.js').read_text(encoding='utf-8')
          required_html=[
              '4-BAND SPECTRAL DYNAMIC PROCESSOR',
              'DEFAULT_FREQ=[31.5,125,1000,8000]',
              'data-action="bypass"',
              'data-action="delta"',
              'class="knob"',
              'for="file"',
              'id="byp1"','id="byp2"','id="byp3"','id="byp4"',
              'app.js?v=3',
              '只顯示實際被改動的時間／頻率'
          ]
          required_app=[
              'processedBand - dryBand',
              'drawProcessedDifference',
              'myefx-denoise',
              'denoise-processor.js?v=balanced4',
              'transient-processor.js?v=clean4'
          ]
          required_dn=[
              'decision-directed Wiener + log-MMSE style gain',
              'this.noisePower',
              'this.prevCleanPower',
              'this.prevSpp',
              'this.mask'
          ]
          missing=[('HTML',x) for x in required_html if x not in html]
          missing += [('APP',x) for x in required_app if x not in app]
          missing += [('DENOISE',x) for x in required_dn if x not in dn]
          if missing:
              raise SystemExit('DSP contract failed: '+', '.join(f'{a}:{b}' for a,b in missing))
          forbidden=['legacy-file-loader.js','io-fix.js','file-io-hardfix.js','app-loader-repair.js','four-band-fix.js','knob-ui.js','perf-fix.js']
          bad=[x for x in forbidden if x in html or x in app]
          if bad:
              raise SystemExit('Obsolete patch layer still referenced: '+', '.join(bad))
          print('4-band / DELTA / adaptive spectral denoise / difference-only spectrogram validation OK')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
