name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply DE-NOISE V6 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Validate DE-NOISE V6 and run focused regression matrix
        run: |
          node WebTester/denoise-v5-selfcheck.mjs
          node --check WebTester/app-final.js
          node --check WebTester/patch-denoise.mjs
          node --check WebTester/self-test.mjs

      - name: Fix legacy regression harness assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'WebTester/self-test.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replaceAll("new Event('input',{bubbles:true))});", "new Event('input',{bubbles:true}));});");
          s = s.replace("DENOISE_REWRITE_V4", "DENOISE_REWRITE_V6");
          s = s.replace("DENOISE_REWRITE_V5", "DENOISE_REWRITE_V6");
          s = s.replace("if(s.delta&&!s.deltaGateTargets.some((x,j)=>x&&j+1===s.delta))errors.push('delta');", "if(s.deltaGateTargets.filter(Boolean).length>1)errors.push('delta-multi');");
          fs.writeFileSync(p, s);
          NODE

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser regression checks
        run: node WebTester/self-test.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply DE-NOISE V6 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Validate required files
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app-final.js
          test -s WebTester/patch-denoise.mjs
          grep -q 'DENOISE_REWRITE_V6' WebTester/app-final.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
