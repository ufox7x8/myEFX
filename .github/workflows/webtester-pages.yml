name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js

      - name: Validate clean architecture
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app.js
          test -s WebTester/denoise-processor.js
          test -s WebTester/transient-processor.js
          grep -q 'id="byp1"' WebTester/index-fixed.html
          grep -q 'id="byp2"' WebTester/index-fixed.html
          grep -q 'id="byp3"' WebTester/index-fixed.html
          grep -q 'id="byp4"' WebTester/index-fixed.html
          grep -q 'app.js?v=5' WebTester/index-fixed.html
          grep -q 'BAND_COUNT = 4' WebTester/app.js
          grep -q 'Wet−Dry' WebTester/app.js
          grep -q 'deltaBand' WebTester/app.js
          grep -q "c.audioWorklet.addModule('denoise-processor.js?v=rewrite2')" WebTester/app.js
          grep -q "c.audioWorklet.addModule('transient-processor.js?v=rewrite2')" WebTester/app.js
          grep -q 'myefx-denoise' WebTester/app.js
          grep -q 'myefx-transient' WebTester/app.js
          grep -q 'this.gain = 1' WebTester/denoise-processor.js
          grep -q 'Math.pow(10, -reductionDb / 20)' WebTester/denoise-processor.js
          grep -q 'if (Math.abs(punch)' WebTester/transient-processor.js
          echo 'Clean rewrite validation passed'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
