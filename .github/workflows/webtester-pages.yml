name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Validate 8-band UI
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('WebTester/index.html').read_text(encoding='utf-8')
          for i in range(1,9):
              assert f'id="freq{i}"' in s
              assert f'id="byp{i}"' in s
              assert f'id="delta{i}"' in s
          assert 'perf-fix.js' not in s
          print('8-band UI validation OK')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: mkdir -p _site && cp -R WebTester/. _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
