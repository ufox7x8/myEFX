name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Validate required files and UI contracts
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app.js
          test -s WebTester/denoise-processor.js
          test -s WebTester/transient-processor.js
          grep -q 'id="byp1"' WebTester/index-fixed.html
          grep -q 'id="byp2"' WebTester/index-fixed.html
          grep -q 'id="byp3"' WebTester/index-fixed.html
          grep -q 'id="byp4"' WebTester/index-fixed.html
          grep -q 'app.js?v=4' WebTester/index-fixed.html
          grep -q 'rangeIn' WebTester/index-fixed.html
          grep -q 'rangeOut' WebTester/index-fixed.html
          grep -q 'deltaBand' WebTester/app.js
          grep -q 'setRangeFromCanvas' WebTester/app.js
          grep -q "e.code !== 'Space'" WebTester/app.js
          grep -q 'this.BANDS = 64' WebTester/denoise-processor.js
          if grep -qE 'decision-directed Wiener|log-MMSE' WebTester/denoise-processor.js; then
            echo 'Unexpected old Wiener/log-MMSE implementation remains'
            exit 1
          fi
          echo 'Required files, syntax, DELTA, RX-style 64-band gate, keyboard and range-loop contracts OK'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
