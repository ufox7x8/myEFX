name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app-final.js
          node --check WebTester/self-test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run PLAN60 + 50 + 480 + 320 browser regression checks
        run: node WebTester/self-test.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate required files
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app-final.js
          test -s WebTester/self-test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
