name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Validate clean 4-band entry
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('WebTester/index-fixed.html').read_text(encoding='utf-8')
          required=['4-BAND SPECTRAL DYNAMIC PROCESSOR','DEFAULT_FREQ=[31.5,125,1000,8000]','data-action="bypass"','data-action="delta"','class="knob"','for="file"','app.js?v=1']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing clean rebuild markers: '+', '.join(missing))
          forbidden=['legacy-file-loader.js','io-fix.js','file-io-hardfix.js','app-loader-repair.js','four-band-fix.js','knob-ui.js']
          present=[x for x in forbidden if x in s]
          if present: raise SystemExit('Obsolete patch layer still referenced: '+', '.join(present))
          print('Clean native 4-band entry validation OK')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
