name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply DE-NOISE V6 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Apply final UI cleanup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app='WebTester/app-final.js';
          let js=fs.readFileSync(app,'utf8');
          js=js.replace(/\$\('bypassAll'\)\.textContent=allBypass\?'BYPASS ON':'BYPASS OFF';/g, "$('bypassAll').textContent='⏻';");
          js=js.replace(/\$\('bypassAll'\)\.textContent='BYPASS OFF';/g, "$('bypassAll').textContent='⏻';");
          const wheelFix="\n;(()=>{const stopWheel=e=>{if(e.target.closest?.('.topbar,.graph-wrap'))e.preventDefault()};document.addEventListener('wheel',stopWheel,{capture:true,passive:false})})();\n";
          if(!js.includes("'.topbar,.graph-wrap'"))js+=wheelFix;
          fs.writeFileSync(app,js,'utf8');
          const index='WebTester/index-fixed.html';
          let html=fs.readFileSync(index,'utf8');
          html=html.replace(/\.social-row\{[^}]*\}/g,'').replace(/\.social\{[^}]*\}/g,'');
          html=html.replace(/<div class="social-row">[\s\S]*?<\/div><\/aside>/g,'</aside>');
          fs.writeFileSync(index,html,'utf8');
          NODE

      - name: Run deterministic DE-NOISE and UI regression matrices
        run: |
          node WebTester/denoise-v5-selfcheck.mjs
          node WebTester/ui-selfcheck.mjs
          node --check WebTester/app-final.js
          node --check WebTester/patch-denoise.mjs
          node --check WebTester/ui-frequalizer.js
          node --check WebTester/ui-selfcheck.mjs
          node --check WebTester/ui-browser-selftest.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real-browser UI regression checks
        run: node WebTester/ui-browser-selftest.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply DE-NOISE V6 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Apply final UI cleanup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app='WebTester/app-final.js';
          let js=fs.readFileSync(app,'utf8');
          js=js.replace(/\$\('bypassAll'\)\.textContent=allBypass\?'BYPASS ON':'BYPASS OFF';/g, "$('bypassAll').textContent='⏻';");
          js=js.replace(/\$\('bypassAll'\)\.textContent='BYPASS OFF';/g, "$('bypassAll').textContent='⏻';");
          const wheelFix="\n;(()=>{const stopWheel=e=>{if(e.target.closest?.('.topbar,.graph-wrap'))e.preventDefault()};document.addEventListener('wheel',stopWheel,{capture:true,passive:false})})();\n";
          if(!js.includes("'.topbar,.graph-wrap'"))js+=wheelFix;
          fs.writeFileSync(app,js,'utf8');
          const index='WebTester/index-fixed.html';
          let html=fs.readFileSync(index,'utf8');
          html=html.replace(/\.social-row\{[^}]*\}/g,'').replace(/\.social\{[^}]*\}/g,'');
          html=html.replace(/<div class="social-row">[\s\S]*?<\/div><\/aside>/g,'</aside>');
          fs.writeFileSync(index,html,'utf8');
          NODE

      - name: Validate required files
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app-final.js
          test -s WebTester/patch-denoise.mjs
          test -s WebTester/ui-frequalizer.js
          test -s WebTester/ui-selfcheck.mjs
          test -s WebTester/ui-browser-selftest.mjs
          grep -q 'DENOISE_REWRITE_V6' WebTester/app-final.js
          grep -q 'ui-frequalizer.js' WebTester/index-fixed.html
          ! grep -q 'social-row' WebTester/index-fixed.html
          ! grep -q 'class="social"' WebTester/index-fixed.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
