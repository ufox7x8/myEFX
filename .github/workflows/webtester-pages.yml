name: Deploy myEFX Web Tester

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply DE-NOISE V4 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Add DE-NOISE runtime probe
        run: node WebTester/patch-denoise-probe.mjs

      - name: Fix regression harness syntax and remove invalid headless RMS gates
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'WebTester/self-test.mjs';
          let s = fs.readFileSync(p, 'utf8');

          s = s.replaceAll("new Event('input',{bubbles:true))});", "new Event('input',{bubbles:true}));});");

          const begin = "  await page.locator('#resetAll').click();const denoiseOff=";
          const end = "  const all180=";
          const a = s.indexOf(begin);
          const b = s.indexOf(end, a);
          if (a >= 0 && b > a) {
            const replacement = `  await page.locator('#resetAll').click();\n  await page.locator('#loop').click();\n  await page.locator('#play').click();\n  await page.waitForTimeout(450);\n  const denoiseProbe = await page.evaluate(() => window.myEFX.debugState().denoiseProbe?.[1] || null);\n  await page.locator('#stop').click();\n  if (!denoiseProbe || denoiseProbe.blocks < 5) fail('DE-NOISE callback did not run: '+JSON.stringify(denoiseProbe));\n  else console.log('DE-NOISE DSP callback probe: PASS', JSON.stringify(denoiseProbe));\n\n`;
            s = s.slice(0, a) + replacement + s.slice(b);
          }

          fs.writeFileSync(p, s);
          NODE

      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/app-final.js
          node --check WebTester/patch-denoise.mjs
          node --check WebTester/patch-denoise-probe.mjs
          node --check WebTester/self-test.mjs

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser regression checks
        run: node WebTester/self-test.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply DE-NOISE V4 runtime rewrite
        run: node WebTester/patch-denoise.mjs

      - name: Validate required files
        run: |
          test -s WebTester/index-fixed.html
          test -s WebTester/app-final.js
          test -s WebTester/patch-denoise.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
