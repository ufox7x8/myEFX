name: Deploy myEFX Web Tester - Previous UI Final

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/**'
      - '.github/workflows/webtester-pages-delta-final.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-previous-ui-final
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build canonical audio graph
        run: |
          node WebTester/build-v5-fix.js
          node WebTester/denoise-reference-fix.js
          node WebTester/denoise-canonicalize.js
          node WebTester/eq-realtime-patch.js
          node WebTester/processed-spectrum-fix.js
          node WebTester/denoise-range-fix.js
      - name: Validate JavaScript syntax
        run: |
          node --check WebTester/build-v5-fix.js
          node --check WebTester/denoise-reference-fix.js
          node --check WebTester/denoise-canonicalize.js
          node --check WebTester/eq-realtime-patch.js
          node --check WebTester/processed-spectrum-fix.js
          node --check WebTester/denoise-range-fix.js
          node --check WebTester/ui-6850-verify.js
          node --check WebTester/denoise-range-verify-500.js
          node --check WebTester/eq-verify-500.js
          node --check WebTester/app.js
          node --check WebTester/delta-verify-500-v3.js
          node --check WebTester/denoise-verify-600.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Run 6850 full previous UI + parameter regression
        run: node WebTester/ui-6850-verify.js
      - name: Run 500 EQ realtime verification
        run: node WebTester/eq-verify-500.js
      - name: Run 500 De-noise range + Processed Spectrogram verification
        run: node WebTester/denoise-range-verify-500.js
      - name: Run 500 DELTA verification
        run: node WebTester/delta-verify-500-v3.js
      - name: Run 600 De-noise verification
        run: node WebTester/denoise-verify-600.js
      - name: Validate final contract
        run: |
          grep -q 's.eq.frequency.setTargetAtTime(freq, now, .0015)' WebTester/app.js
          grep -q 's.eq.Q.setTargetAtTime(q, now, .0015)' WebTester/app.js
          grep -q 's.eq.gain.setTargetAtTime(b.bypass ? 0 : b.gain, now, .0015)' WebTester/app.js
          grep -q 'function ensureProcessedAnalyser' WebTester/app.js
          grep -q 'function startProcessedPreview' WebTester/app.js
          grep -q 'function scheduleProcessedRender' WebTester/app.js
          grep -q 'runProcessedLive();' WebTester/app.js
          if grep -q 'new OfflineAudioContext' WebTester/app.js; then exit 1; fi
          if grep -q 'await c.startRendering()' WebTester/app.js; then exit 1; fi
          grep -q 'this.clamp(rawAmount / 100, 0.01, 0.99)' WebTester/denoise-processor.js
          grep -q 'dryL \* (1 - amount) + fullStrengthL\[n\] \* amount' WebTester/denoise-processor.js
          grep -q 'dryR \* (1 - amount) + fullStrengthR\[n\] \* amount' WebTester/denoise-processor.js
          grep -q 'DELTA_DENOISE_LATENCY_SAMPLES = 4096' WebTester/app.js
          grep -q 'deltaBand.connect(deltaDry)' WebTester/app.js
          grep -q 'deltaBand.connect(deltaIdentityWet)' WebTester/app.js
          grep -q 'deltaBand.connect(deltaEQ)' WebTester/app.js
          grep -q 'source.connect(selected.deltaBandBP1)' WebTester/app.js
          grep -q 'selected.deltaMute.connect(graph.master)' WebTester/app.js
          grep -q 'this.N = 4096' WebTester/denoise-processor.js
          grep -q 'this.H = 512' WebTester/denoise-processor.js
          grep -q 'this.alphaS = 0.90' WebTester/denoise-processor.js
          grep -q 'this.ddAlpha = 0.98' WebTester/denoise-processor.js
          grep -q 'smoothGainCepstral' WebTester/denoise-processor.js
          grep -q 'musicalPostFilter' WebTester/denoise-processor.js
          grep -q 'this.olaNorm' WebTester/denoise-processor.js
          grep -q 'crimson-theme.css' WebTester/index-fixed.html || true
          test -s WebTester/crimson-theme.css
          test -f WebTester/assets/redcore-emblem.svg
          if grep -q 'METAL SPECTRAL PROCESSOR' WebTester/index-fixed.html; then exit 1; fi
          if grep -q 'PARAMETRIC' WebTester/index-fixed.html; then exit 1; fi
          if grep -q 'Feed prior sections normally' WebTester/app.js; then exit 1; fi
          if grep -q 'boundaries = new Map' WebTester/app.js; then exit 1; fi
          if grep -q 'deltaBandHP1' WebTester/app.js; then exit 1; fi
          if grep -q 'deltaBandLP1' WebTester/app.js; then exit 1; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R WebTester/. _site/
          cp WebTester/index-fixed.html _site/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="crimson-theme.css?v=2"></head>#' _site/index.html
          sed -i 's#</body>#<script src="eq-realtime-patch.js?v=6850"></script><script>window.__MYEFX_CRIMSON__=1;</script></body>#' _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
