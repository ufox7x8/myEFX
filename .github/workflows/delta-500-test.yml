name: myEFX DELTA 500x Test

on:
  push:
    branches: [main]
    paths:
      - 'WebTester/app.js'
      - 'WebTester/build-v5-fix.js'
      - 'WebTester/delta-verify-500.js'
      - 'WebTester/denoise-processor.js'
      - 'WebTester/transient-processor.js'
      - '.github/workflows/delta-500-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta-500:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build canonical app
        run: node WebTester/build-v5-fix.js
      - name: Syntax check
        run: |
          node --check WebTester/build-v5-fix.js
          node --check WebTester/app.js
          node --check WebTester/delta-verify-500.js
          node --check WebTester/denoise-processor.js
          node --check WebTester/transient-processor.js
      - name: Run 500 DELTA tests
        run: node WebTester/delta-verify-500.js
